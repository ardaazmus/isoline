name: isoline

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-isoline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isoline-dev}
      POSTGRES_DB: ${POSTGRES_DB:-isoline}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-isoline}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-isoline}:${POSTGRES_PASSWORD:-isoline-dev}@db:5432/${POSTGRES_DB:-isoline}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
